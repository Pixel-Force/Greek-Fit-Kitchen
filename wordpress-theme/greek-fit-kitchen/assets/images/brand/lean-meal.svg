<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Apple with Dumbbell Barbell -->
  <g transform="translate(10, 8)">
    <!-- Dumbbell ends -->
    <rect x="0" y="16" width="4" height="12" rx="1.5" fill="#0ea5e9"/>
    <rect x="5" y="14" width="4" height="16" rx="1.5" fill="#0ea5e9"/>
    <rect x="35" y="14" width="4" height="16" rx="1.5" fill="#0ea5e9"/>
    <rect x="40" y="16" width="4" height="12" rx="1.5" fill="#0ea5e9"/>
    <!-- Apple body -->
    <path d="M22 10C16 10 12 14 12 21C12 30 19 36 22 36C25 36 32 30 32 21C32 14 28 10 22 10Z" fill="#84cc16"/>
    <!-- Apple leaf -->
