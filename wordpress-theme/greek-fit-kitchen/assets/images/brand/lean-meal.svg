  </text>
  <text x="65" y="42" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#65a30d">
    Lean <tspan fill="#0ea5e9">Meal</tspan>
  </text>
  <text x="66" y="54" font-family="'Inter', sans-serif" font-weight="500" font-size="9" fill="#10b981" letter-spacing="1">
    HEALTHY AND CLEAN
  </text>
</svg>
