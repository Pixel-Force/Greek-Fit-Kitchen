<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen Display Tablet (KDS) | Greek Fit Kitchen</title>
  <meta name="robots" content="noindex, nofollow" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            greek: {
              navy: '#101D3A',
              card: '#172A4D',
              gold: '#F5C542',
              goldHover: '#E5B432',
              cream: '#FAF9F5',
              slate: '#292D35',
              border: '#E7E8EC',
              lime: '#23845B',
              red: '#C83D45'
            }
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="public/images/brand/greek-fit-kitchen-logo.png" />
</head>
<body class="bg-[#0C162C] text-slate-100 antialiased min-h-screen flex flex-col font-sans select-none">

  <!-- ================= KITCHEN TABLET HEADER ================= -->
  <header class="bg-[#101D3A] border-b border-white/10 px-6 py-4 sticky top-0 z-40 flex flex-wrap items-center justify-between gap-4 shadow-xl">
    <div class="flex items-center gap-4">
      <img src="public/images/brand/greek-fit-kitchen-logo.png" alt="Greek Fit Kitchen" class="h-10 w-auto" />
      <div>
        <h1 class="text-lg font-black uppercase tracking-tight flex items-center gap-2 text-white">
          <span>KITCHEN DISPLAY TABLET (KDS)</span>
          <span class="text-[10px] bg-emerald-500/20 text-emerald-400 font-black px-2.5 py-0.5 rounded-full border border-emerald-500/40 animate-pulse">
            LIVE SYNC
          </span>
        </h1>
        <p class="text-xs text-slate-400">George the Greek Prep Station · 3575 Lake Shore Blvd W, Etobicoke</p>
      </div>
    </div>

    <!-- Batch Filters & Actions -->
    <div class="flex items-center gap-3">
      <button onclick="seedSampleKitchenOrders()" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-greek-gold text-xs font-bold transition border border-white/20">
        + Load Test Orders
      </button>

      <a href="admin.html" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-bold transition border border-white/20">
        ⚙️ Admin
      </a>

      <a href="index.html" class="px-4 py-2 rounded-xl btn-gold text-xs font-black transition">
        Storefront ↗
      </a>

      <!-- Theme Switcher (Mandatory Rule 1) -->
    </div>
  </header>

  <!-- ================= LIVE STATUS BAR ================= -->
  <div class="bg-[#172A4D] px-6 py-2.5 border-b border-white/10 flex flex-wrap items-center justify-between text-xs text-slate-300">
    <div class="flex items-center gap-4">
      <span class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
        <span>Station Status: <strong class="text-white">Active Preparation</strong></span>
      </span>
      <span class="text-white/20">|</span>
      <span>Total Kitchen Tickets: <strong id="kitchenTotalTicketsCount" class="text-greek-gold">0</strong></span>
    </div>

    <!-- Batch Delivery Filter Tabs -->
    <div class="flex items-center gap-1.5 bg-black/30 p-1 rounded-xl border border-white/10">
      <button onclick="filterKitchenBatch('all')" id="batchBtn_all" class="kitchen-batch-btn px-3 py-1 rounded-lg text-xs font-black bg-greek-gold text-[#101D3A] transition">
        All Batches
      </button>
      <button onclick="filterKitchenBatch('Sunday')" id="batchBtn_Sunday" class="kitchen-batch-btn px-3 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition">
        Sunday Batch
      </button>
      <button onclick="filterKitchenBatch('Wednesday')" id="batchBtn_Wednesday" class="kitchen-batch-btn px-3 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition">
        Wednesday Batch
      </button>
    </div>
  </div>

  <!-- ================= KANBAN BOARD ================= -->
  <main class="flex-1 p-6 overflow-x-auto">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 min-w-[1000px]">

      <!-- COL 1: NEW / RECEIVED -->
      <div class="flex flex-col rounded-3xl bg-[#101D3A]/60 border border-white/10 overflow-hidden shadow-2xl">
        <div class="p-4 bg-amber-500/20 border-b border-amber-500/30 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-amber-400 animate-pulse"></span>
            <h2 class="font-black text-sm uppercase tracking-wide text-amber-300">1. New Orders</h2>
          </div>
          <span id="colCount_Received" class="font-mono font-black text-xs px-2 py-0.5 rounded-full bg-black/40 text-amber-300">0</span>
        </div>
        <div id="colOrders_Received" class="flex-1 p-4 space-y-4 overflow-y-auto max-h-[calc(100vh-230px)]">
          <!-- Tickets -->
        </div>
      </div>

      <!-- COL 2: IN PREPARATION -->
      <div class="flex flex-col rounded-3xl bg-[#101D3A]/60 border border-white/10 overflow-hidden shadow-2xl">
        <div class="p-4 bg-blue-500/20 border-b border-blue-500/30 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-blue-400"></span>
            <h2 class="font-black text-sm uppercase tracking-wide text-blue-300">2. In Prep (Cooking)</h2>
          </div>
          <span id="colCount_InPrep" class="font-mono font-black text-xs px-2 py-0.5 rounded-full bg-black/40 text-blue-300">0</span>
        </div>
        <div id="colOrders_InPrep" class="flex-1 p-4 space-y-4 overflow-y-auto max-h-[calc(100vh-230px)]">
          <!-- Tickets -->
        </div>
      </div>

      <!-- COL 3: READY FOR DISPATCH -->
      <div class="flex flex-col rounded-3xl bg-[#101D3A]/60 border border-white/10 overflow-hidden shadow-2xl">
        <div class="p-4 bg-emerald-500/20 border-b border-emerald-500/30 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-400"></span>
            <h2 class="font-black text-sm uppercase tracking-wide text-emerald-300">3. Ready (Packed)</h2>
          </div>
          <span id="colCount_Ready" class="font-mono font-black text-xs px-2 py-0.5 rounded-full bg-black/40 text-emerald-300">0</span>
        </div>
        <div id="colOrders_Ready" class="flex-1 p-4 space-y-4 overflow-y-auto max-h-[calc(100vh-230px)]">
          <!-- Tickets -->
        </div>
      </div>

      <!-- COL 4: DISPATCHED / COMPLETED -->
      <div class="flex flex-col rounded-3xl bg-[#101D3A]/60 border border-white/10 overflow-hidden shadow-2xl">
        <div class="p-4 bg-slate-800/60 border-b border-white/10 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-slate-400"></span>
            <h2 class="font-black text-sm uppercase tracking-wide text-slate-300">4. Dispatched / Done</h2>
          </div>
          <span id="colCount_Completed" class="font-mono font-black text-xs px-2 py-0.5 rounded-full bg-black/40 text-slate-300">0</span>
        </div>
        <div id="colOrders_Completed" class="flex-1 p-4 space-y-4 overflow-y-auto max-h-[calc(100vh-230px)]">
          <!-- Tickets -->
        </div>
      </div>

    </div>
  </main>

  <!-- ================= PRINTABLE TICKET ELEMENT ================= -->
  <div id="printableTicket" class="hidden"></div>

  <!-- ================= MANDATORY FOOTER CREDIT BAR ================= -->
  <footer class="bg-[#101D3A] border-t border-white/10 mt-auto">
  </footer>

  <script src="app.js"></script>
  <script>
    // ==========================================
    // KITCHEN DISPLAY LOGIC
    // ==========================================
    let currentBatchFilter = "all";

    function filterKitchenBatch(batch) {
      currentBatchFilter = batch;
      document.querySelectorAll(".kitchen-batch-btn").forEach(btn => {
        btn.className = "kitchen-batch-btn px-3 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition";
      });
      const activeBtn = document.getElementById("batchBtn_" + batch);
      if (activeBtn) {
        activeBtn.className = "kitchen-batch-btn px-3 py-1 rounded-lg text-xs font-black bg-greek-gold text-[#101D3A] transition";
      }
      renderKitchenKanban();
    }

    function renderKitchenKanban() {
      const orders = getStoredOrders();
      
      const filtered = orders.filter(o => {
        if (currentBatchFilter === "all") return true;
        return o.scheduledDate && o.scheduledDate.includes(currentBatchFilter);
      });

      const countBadge = document.getElementById("kitchenTotalTicketsCount");
      if (countBadge) countBadge.innerText = filtered.length;

      const groups = {
        Received: [],
        InPrep: [],
        Ready: [],
        Completed: []
      };

      filtered.forEach(o => {
        if (o.status === "Received") groups.Received.push(o);
        else if (o.status === "In Prep") groups.InPrep.push(o);
        else if (o.status === "Ready") groups.Ready.push(o);
        else if (o.status === "Completed") groups.Completed.push(o);
        else groups.Received.push(o);
      });

      document.getElementById("colCount_Received").innerText = groups.Received.length;
      document.getElementById("colCount_InPrep").innerText = groups.InPrep.length;
      document.getElementById("colCount_Ready").innerText = groups.Ready.length;
      document.getElementById("colCount_Completed").innerText = groups.Completed.length;

      renderColumn("colOrders_Received", groups.Received, "Received");
      renderColumn("colOrders_InPrep", groups.InPrep, "In Prep");
      renderColumn("colOrders_Ready", groups.Ready, "Ready");
      renderColumn("colOrders_Completed", groups.Completed, "Completed");
    }

    function renderColumn(containerId, list, stage) {
      const container = document.getElementById(containerId);
      if (!container) return;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-slate-500 text-xs">
            No tickets in this stage.
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(order => {
        const isPickup = order.deliveryMethod === "pickup";
        return `
          <div class="bg-[#172A4D] rounded-2xl border border-white/10 p-4 shadow-xl flex flex-col justify-between space-y-3 relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1.5 ${isPickup ? 'bg-amber-400' : 'bg-greek-lime'}"></div>
            
            <div>
              <div class="flex items-center justify-between pt-1">
                <span class="font-mono font-black text-sm text-greek-gold">#${order.orderId}</span>
                <span class="text-[10px] uppercase font-black px-2 py-0.5 rounded ${isPickup ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-300'}">
                  ${isPickup ? '🏪 Store Pickup' : '🚚 Scheduled Delivery'}
                </span>
              </div>

              <div class="mt-2">
                <strong class="text-sm text-white block">${order.customerName}</strong>
                <span class="text-[11px] text-slate-400">${order.customerPhone}</span>
                <div class="text-[11px] font-semibold text-greek-gold mt-0.5">🗓️ ${order.scheduledDate}</div>
              </div>

              <!-- Itemized Food Plates & Sides -->
              <div class="mt-3 pt-2 border-t border-white/10 space-y-2 text-xs">
                ${order.items.map(it => `
                  <div class="p-2 rounded-xl bg-black/20 border border-white/5">
                    <div class="font-bold text-white flex justify-between">
                      <span>${it.quantity}x ${it.name}</span>
                    </div>
                    ${it.hasSides && it.side1 ? `
                      <div class="text-[11px] text-sky-300 pl-2 mt-0.5">• Side 1: ${it.side1}</div>
                      <div class="text-[11px] text-sky-300 pl-2">• Side 2: ${it.side2}</div>
                    ` : `
                      <div class="text-[11px] text-amber-400 pl-2 mt-0.5">• Complete Plate (No Sides)</div>
                    `}
                    ${it.extraSides && it.extraSides.length ? `
                      <div class="text-[11px] text-greek-lime pl-2 font-semibold">• Extra: ${it.extraSides.join(", ")}</div>
                    ` : ''}
                    ${it.notes ? `
                      <div class="text-[10px] text-slate-400 italic pl-2 mt-0.5">Note: "${it.notes}"</div>
                    ` : ''}
                  </div>
                `).join("")}
              </div>
            </div>

            <!-- Action Buttons for Cook/Packer -->
            <div class="pt-2 border-t border-white/10 flex flex-wrap items-center gap-1.5">
              ${stage === 'Received' ? `
                <button onclick="advanceTicketStage('${order.orderId}', 'In Prep')" class="flex-1 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-black transition shadow">
                  Start Prep 👨‍🍳
                </button>
              ` : ''}

              ${stage === 'In Prep' ? `
                <button onclick="advanceTicketStage('${order.orderId}', 'Ready')" class="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black transition shadow">
                  Mark Ready ✅
                </button>
              ` : ''}

              ${stage === 'Ready' ? `
                <button onclick="advanceTicketStage('${order.orderId}', 'Completed')" class="flex-1 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-xs font-black transition shadow">
                  Dispatch 🚀
                </button>
              ` : ''}

              ${stage === 'Completed' ? `
                <span class="text-[11px] text-slate-400 py-1 font-semibold">Completed Ticket</span>
              ` : ''}

              <button onclick="printPrepSlip('${order.orderId}')" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-bold" title="Print Slip">
                🖨️
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function advanceTicketStage(orderId, newStatus) {
      let orders = getStoredOrders();
      const idx = orders.findIndex(o => o.orderId === orderId);
      if (idx !== -1) {
        orders[idx].status = newStatus;
        saveStoredOrders(orders);
        renderKitchenKanban();
        showToast(`Ticket #${orderId} moved to ${newStatus}`);
      }
    }

    function seedSampleKitchenOrders() {
      const sampleOrders = [
        {
          orderId: "GFK-602931",
          timestamp: new Date().toISOString(),
          customerName: "Sofia Karas",
          customerEmail: "sofia.k@toronto.com",
          customerPhone: "416-555-0812",
          deliveryMethod: "delivery",
          deliveryAddress: "155 The West Mall, Etobicoke, ON M9C 5Z8",
          scheduledDate: "Upcoming Sunday Batch (10:00 AM - 2:00 PM)",
          items: [
            { id: "grilled-chicken", name: "Grilled Chicken", unitPrice: 12.99, quantity: 2, side1: "Lemon Roasted Potatoes", side2: "Green Beans in Tomato Sauce", extraSides: [], hasSides: true },
            { id: "salmon", name: "Salmon", unitPrice: 14.99, quantity: 2, side1: "Yellow Basmati Rice", side2: "Sautéed Veggies", extraSides: ["Sweet Potatoes"], hasSides: true },
            { id: "pasta-al-greco", name: "Pasta al Greco", unitPrice: 9.99, quantity: 2, side1: null, side2: null, extraSides: [], hasSides: false }
          ],
          itemCount: 6,
          subtotal: 75.94,
          discount: 0,
          deliveryFee: 11.93,
          tax: 11.42,
          grandTotal: 99.29,
          status: "Received",
          paymentStatus: "Paid (Stripe Gateway Authorized)",
          authCode: "AUTH-602931-CAD"
        },
        {
          orderId: "GFK-491028",
          timestamp: new Date(Date.now() - 7200000).toISOString(),
          customerName: "Alexandre Tremblay",
          customerEmail: "alexandre.t@ontario.ca",
          customerPhone: "416-555-0377",
          deliveryMethod: "pickup",
          deliveryAddress: "3575 Lake Shore Blvd W, Etobicoke (Store Pickup)",
          scheduledDate: "Upcoming Wednesday Batch (4:00 PM - 8:00 PM)",
          items: [
            { id: "beef-souvlaki", name: "Beef Souvlaki Plate", unitPrice: 13.99, quantity: 4, side1: "Garlic Butter Baked Potatoes", side2: "Rice Pilaf with Veggies", extraSides: [], hasSides: true },
            { id: "tandoori-chicken", name: "Tandoori Chicken", unitPrice: 14.99, quantity: 3, side1: "Yellow Basmati Rice", side2: "Steamed Veggies", extraSides: [], hasSides: true }
          ],
          itemCount: 7,
          subtotal: 100.93,
          discount: 10.09,
          deliveryFee: 0,
          tax: 11.81,
          grandTotal: 102.65,
          status: "In Prep",
          paymentStatus: "Paid (Stripe Gateway Authorized)",
          authCode: "AUTH-491028-CAD"
        }
      ];

      saveStoredOrders(sampleOrders);
      renderKitchenKanban();
      showToast("Seeded 2 live kitchen tickets!");
    }

    function printPrepSlip(orderId) {
      const order = getStoredOrders().find(o => o.orderId === orderId);
      if (!order) return;

      const ticket = document.getElementById("printableTicket");
      ticket.innerHTML = `
        <div style="font-family: monospace; max-width: 400px; padding: 20px;">
          <h2>GREEK FIT KITCHEN — PREP TICKET</h2>
          <p><strong>Order: #${order.orderId}</strong> | ${order.scheduledDate}</p>
          <p>Customer: ${order.customerName} (${order.customerPhone})</p>
          <p>Fulfillment: ${order.deliveryMethod === 'pickup' ? 'PICKUP @ George the Greek' : order.deliveryAddress}</p>
          <hr />
          <h3>MEALS & SIDES:</h3>
          ${order.items.map(it => `
            <div style="margin-bottom: 8px;">
              <strong>${it.quantity}x ${it.name}</strong><br />
              ${it.hasSides ? `• Side 1: ${it.side1}<br />• Side 2: ${it.side2}` : '• COMPLETE PLATE'}
              ${it.extraSides && it.extraSides.length ? `<br />• EXTRA: ${it.extraSides.join(", ")}` : ''}
              ${it.notes ? `<br />• NOTE: ${it.notes}` : ''}
            </div>
          `).join("")}
          <hr />
          <p>TOTAL MEALS: ${order.itemCount} | TOTAL PAID: $${order.grandTotal.toFixed(2)} CAD</p>
        </div>
      `;
      window.print();
    }

    window.addEventListener("storage", (e) => {
      if (e.key === "gfk_orders") {
        renderKitchenKanban();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      renderKitchenKanban();
    });
  </script>
</body>
</html>
